name: Catalogue links

# Weekly check of every address in the tool catalogue and of every news feed.
# When something is broken it opens one issue, or updates the open one, with a
# section for each. It never changes the data.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check links
        id: links
        run: |
          set +e
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-links.ts > report.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Check news sources
        id: news
        run: |
          set +e
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-news.ts > news.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the issue
        env:
          TITLE: Broken catalogue links
          LINKS_STATUS: ${{ steps.links.outputs.status }}
          NEWS_STATUS: ${{ steps.news.outputs.status }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ "$LINKS_STATUS" != "0" ] || [ "$NEWS_STATUS" != "0" ]; then
            {
              echo "The weekly check found problems. It never changes the data."
              echo
              echo "## Catalogue links"
              echo
              if [ "$LINKS_STATUS" != "0" ]; then
                echo "Fix the address in \`src/data/catalogue/tools/\`, or remove the link if you cannot confirm the official one. Do not set \`verified\`; see docs/VERIFYING-DATA.md."
                echo
                echo '```text'
                head -c 40000 report.txt
                echo '```'
              else
                echo "No broken links."
              fi
              echo
              echo "## News sources"
              echo
              if [ "$NEWS_STATUS" != "0" ]; then
                echo "Fix or remove the source in \`src/data/news/sources.json\`; see docs/NEWS-SOURCES.md."
                echo
                echo '```text'
                head -c 15000 news.txt
                echo '```'
              else
                echo "All news sources are healthy."
              fi
              echo
              echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > issue.md
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file issue.md
            else
              gh issue create --title "$TITLE" --body-file issue.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "The weekly check found no broken links and no unhealthy news sources."
          fi
