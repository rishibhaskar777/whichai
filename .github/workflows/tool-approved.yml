name: Tool candidate approved

# When the "approved" label is added to a candidate issue, post one comment
# with a draft catalogue record. The issue is read through the API, never
# from the event text. It changes nothing else. See docs/TOOL-DISCOVERY.md.
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: tool-approved-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Post the draft record
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/discover-draft.ts
